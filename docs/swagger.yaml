basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  beepicker.pickRequest:
    description: Request body for adding and/or dropping courses
    properties:
      courseCodes:
        description: Course CRNs to add (legacy format, same as ECRN)
        items:
          type: string
        type: array
      ECRN:
        description: Course CRNs to add
        items:
          type: string
        type: array
      SCRN:
        description: Course CRNs to drop
        items:
          type: string
        type: array
    type: object
  models.PersonDTO:
    properties:
      class:
        type: string
      department:
        type: string
      email:
        type: string
      faculty:
        type: string
      first_name:
        type: string
      gpa:
        type: string
      last_name:
        type: string
      photo:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: BeeHub Ders Seçim Botu için API dokümantasyonu.
  title: BeeHub Ders Seçim Botu API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: login failed
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: kepler service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login and get token
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - Auth
  /auth/profile:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PersonDTO'
        "401":
          description: unauthenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: profile not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Auth
  /beePicker/courses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: course list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: cannot retrieve course information
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retrieves courses from the BeePicker.
      tags:
      - BeePicker
  /beePicker/pick:
    post:
      consumes:
      - application/json
      description: Picks courses (ECRN) and/or drops courses (SCRN) based on the request.
      parameters:
      - description: Request body containing courses to add and/or drop
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/beepicker.pickRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation successful
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Picks or drops courses from Kepler.
      tags:
      - BeePicker
  /start-service:
    get:
      description: Starts the BeeHubBot process as a background process
      responses:
        "200":
          description: Process started
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error starting process
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start the BeeHubBot process
      tags:
      - Service
  /stop-service:
    get:
      description: Stops the BeeHubBot process
      responses:
        "200":
          description: Process stopped
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error stopping process
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stop the BeeHubBot process
      tags:
      - Service
securityDefinitions:
  BearerAuth:
    description: 'Authorization header with Bearer token. Example: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
